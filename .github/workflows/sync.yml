name: Sync upstream mmw-agent image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - scripts/fetch-release.sh
      - .github/workflows/sync.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sync-upstream-mmw-agent
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mmw-agent-docker

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Discover latest upstream release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release=$(curl --fail --silent --show-error --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mmwx-group/mmwx-agent/releases/latest)
          tag=$(jq -r '.tag_name' <<<"$release")
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid upstream tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether version is already published
        id: existing
        shell: bash
        run: |
          if docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.release.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.release.outputs.tag }} is already published"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify release assets
        if: steps.existing.outputs.published != 'true'
        run: bash ./scripts/fetch-release.sh "${{ steps.release.outputs.tag }}" assets

      - name: Set up QEMU
        if: steps.existing.outputs.published != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.existing.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and test each platform
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            test_tag="mmw-agent-smoke:${arch}"
            docker buildx build \
              --platform "linux/${arch}" \
              --load \
              --provenance=false \
              --build-arg "VERSION=${{ steps.release.outputs.version }}" \
              --tag "$test_tag" .
            docker run --rm --read-only --network none \
              --tmpfs /run --tmpfs /var/lib/mmwx-guard \
              --entrypoint /bin/sh "$test_tag" -c '
                set -e
                mkdir -p /run/mmwx-guard-agent
                /usr/local/bin/mmwx-guardd \
                  --role agent \
                  --socket /run/mmwx-guard-agent/guard.sock \
                  --state-dir /var/lib/mmwx-guard \
                  --manifest /usr/local/share/mmwx-guard/agent.manifest &
                pid=$!
                i=0
                while [ "$i" -lt 50 ] && [ ! -S /run/mmwx-guard-agent/guard.sock ]; do
                  kill -0 "$pid"
                  i=$((i + 1))
                  sleep 0.1
                done
                test -S /run/mmwx-guard-agent/guard.sock
                if kill -0 "$pid" 2>/dev/null; then
                  kill "$pid"
                  wait "$pid" 2>/dev/null || true
                else
                  wait "$pid"
                fi
              '
          done

      - name: Build and publish multi-platform image
        if: steps.existing.outputs.published != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
